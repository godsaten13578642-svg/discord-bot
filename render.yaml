# ── Render Blueprint ──────────────────────────────────────────────────────────
# Deploys the Civilization Bot as a single web service (API + WebSocket + bot)
# plus an optional dashboard. Deploy via Render Dashboard → New → Blueprint.
#
# After the first deploy:
#   1. Open the civbot service → Environment tab
#   2. Set DISCORD_BOT_TOKEN (and optionally DISCORD_CLIENT_ID)
#   3. The service restarts automatically and the bot comes online
#
# The plugin's config.yml should then point at this service:
#   api-url: "https://civbot-api.onrender.com"   (your actual service URL)
#   ws-url:   "wss://civbot-api.onrender.com/ws"
#   api-key:  (same value as MC_API_KEY below)
#
# render.yaml also accepts sync:false env vars — Render prompts you for
# DISCORD_BOT_TOKEN when you apply the blueprint, so it's set from day one.
#
# FREE TIER NOTES:
#   - plan: free gives 512 MB RAM and 750 instance-hours/month (enough for
#     this one service to run 24/7).
#   - Free services spin down after 15 min without inbound traffic; server.js
#     self-pings /health every 10 min to stay awake, but wake-ups can still
#     happen and cost a ~50s cold start on the next request.
#   - Free tier has NO persistent disk: files written at runtime (error
#     reports, db.json) reset on every deploy/restart. Set DATABASE_URL to a
#     free Neon Postgres so accounts survive.

services:
  # Single service: Express API + WebSocket bridge + Discord bot + dashboard +
  # error-report pages. Web service (not worker) so Render gives us a public URL
  # for the plugin and free-tier health checks/keep-alive work.
  - type: web
    name: civbot-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install --omit=dev && cd frontend && npm install --legacy-peer-deps && npm run build && cd .. && node minecraft-plugin/tools/stage_artifacts.mjs
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Free instances have 512 MB RAM; cap the V8 heap so the CRA dashboard
      # build doesn't get OOM-killed during deploys.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      # Skip browser source maps — cuts CRA build memory/time on the free tier
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: DISCORD_BOT_TOKEN
        sync: false          # Render prompts for this when applying the blueprint
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: MC_API_KEY
        generateValue: true  # auto-generate a strong key shared with the plugin
      - key: JWT_SECRET
        generateValue: true
      # Free Neon Postgres — accounts AND game state (economy, announcements,
      # counters, server data) survive deploys/restarts. Create a project at
      # https://neon.tech, copy the pooled connection string (…-pooler…/neondb),
      # and paste it here (or in the Render dashboard) after the first deploy.
      # Without it the bot falls back to accounts.json + db.json, which reset on
      # every free-tier deploy.
      - key: DATABASE_URL
        sync: false
      # Optional: channel ID (or "guildId:channelId") that gets 🟢 wake-up and
      # 🌙 spin-down notices when the free tier sleeps/wakes. Leave empty to
      # disable. The bot's presence also reflects MC server connection state.
      - key: DISCORD_STATUS_CHANNEL_ID
        sync: false
      # Official Owner — guaranteed master account, synced from these values on
      # every boot (created, or password rotated to match). Change the password
      # HERE (not in the dashboard), then redeploy.
      - key: OWNER_EMAIL
        value: "owner@civbot.admin"
      - key: OWNER_PASSWORD
        value: "7FisKNGA!R2AZ7VRA#4730"
      - key: OWNER_USERNAME
        value: "OfficialOwner"
      # Secret DM (optional overrides — defaults send one 🤫 message per boot
      # to Discord user "memegodmidas"). Uncomment to customize:
      # - key: SECRET_DM_USERNAME
      #   value: "memegodmidas"
      # - key: SECRET_DM_MESSAGE
      #   value: "your secret message here"
  #
  # The dashboard is served by the same service (see server.js static section),
  # so there is no separate frontend service needed.
